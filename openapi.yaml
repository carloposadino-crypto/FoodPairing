openapi: 3.1.0
info:
  title: FoodPairing API
  version: 1.1.0
  description: API pubblica del database FoodPairing di Carlo Posadino. Restituisce ingredienti, abbinamenti, punteggi, evidenze e valutazioni di combinazioni.
servers:
  - url: https://foodpairing-ten.vercel.app
paths:
  /api/foodpairing:
    get:
      operationId: foodpairing
      summary: Interroga il motore FoodPairing
      description: Usa questa operazione per cercare ingredienti, valutare coppie, trovare abbinamenti o valutare combinazioni di quattro ingredienti.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ingredient, pair, pairings, combination, complete]
        - name: name
          in: query
          schema:
            type: string
          description: Nome dell'ingrediente per action=ingredient.
        - name: a
          in: query
          schema:
            type: string
          description: Primo ingrediente per action=pair.
        - name: b
          in: query
          schema:
            type: string
          description: Secondo ingrediente per action=pair.
        - name: ingredient
          in: query
          schema:
            type: string
          description: Ingrediente di partenza per action=pairings.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: ingredients
          in: query
          schema:
            type: string
          description: Quattro ingredienti separati da virgola per action=combination.\n        - name: ingredients\n          in: query\n          schema:\n            type: string\n          description: Tre ingredienti separati da virgola per action=complete.
      responses:
        '200':
          description: Risposta FoodPairing
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Richiesta non valida
        '404':
          description: Ingrediente non trovato o ambiguo
        '500':
          description: Errore del server

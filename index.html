<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodPairing</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f2ed;
  color: #222;
}

header {
  background: #1f1f1f;
  color: white;
  padding: 24px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 8px 0 0;
  color: #ccc;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 16px;
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #f1eee8;
  border-radius: 10px;
}

.tag {
  display: inline-block;
  background: #ddd5c8;
  padding: 7px 10px;
  margin: 4px;
  border-radius: 20px;
}

.score {
  font-size: 28px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>FoodPairing</h1>
  <p>Il motore intelligente per gli abbinamenti gastronomici</p>
</header>

<div class="container">

  <div class="card">

    <h2>🔎 Cerca ingrediente</h2>

    <input
      id="search"
      type="text"
      placeholder="Es. mela, manzo, cioccolato..."
    >

    <button onclick="cerca()">
      Cerca
    </button>

    <div id="risultato"></div>

  </div>


  <div class="card">

    <h2>🍽️ Trova il terzo ingrediente</h2>

    <input
      id="ingrediente1"
      type="text"
      placeholder="Primo ingrediente"
    >

    <input
      id="ingrediente2"
      type="text"
      placeholder="Secondo ingrediente"
    >

    <button onclick="terzoIngrediente()">
      Trova il terzo ingrediente
    </button>

    <div id="terzo"></div>

  </div>


  <div class="card">

    <h2>🔺 Analizza tre ingredienti</h2>

    <input
      id="tri1"
      type="text"
      placeholder="Ingrediente 1"
    >

    <input
      id="tri2"
      type="text"
      placeholder="Ingrediente 2"
    >

    <input
      id="tri3"
      type="text"
      placeholder="Ingrediente 3"
    >

    <button onclick="triangolo()">
      Analizza
    </button>

    <div id="analisi"></div>

  </div>

</div>

<footer>
  FoodPairing — sviluppo in corso
</footer>


<script>

/* =========================

========================= */

}
}

};


/* =========================
   NORMALIZZAZIONE
========================= */

function normalizza(testo){

return testo
.toLowerCase()
.trim()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");

}


/* =========================
   CERCA
========================= */

function cerca(){

const input=normalizza(
document.getElementById("search").value
);

const risultato=document.getElementById("risultato");

if(!input){

risultato.innerHTML=
"<div class='result'>Inserisci un ingrediente.</div>";

return;
}

const ingrediente=ingredients[input];

if(!ingrediente){

risultato.innerHTML=
"<div class='result'>Ingrediente non ancora presente nel database.</div>";

return;
}

let html=`
<div class="result">

<h3>${ingrediente.nome}</h3>

<p>
<strong>Categoria:</strong>
${ingrediente.categoria}
</p>

<p>
<strong>Famiglia:</strong>
${ingrediente.famiglia}
</p>

<p>
<strong>Profilo:</strong>
${ingrediente.profili.join(", ")}
</p>

<p>
<strong>Abbinamenti:</strong>
</p>
`;

const ordinati=
Object.entries(ingrediente.pairing)
.sort((a,b)=>b[1]-a[1]);

ordinati.forEach(([nome,punteggio])=>{

html+=`
<span class="tag">
${nome} ⭐ ${punteggio}
</span>
`;

});

html+="</div>";

risultato.innerHTML=html;

}


/* =========================
   TERZO INGREDIENTE
========================= */

function terzoIngrediente(){

const a=normalizza(
document.getElementById("ingrediente1").value
);

const b=normalizza(
document.getElementById("ingrediente2").value
);

const risultato=document.getElementById("terzo");

if(!a||!b){

risultato.innerHTML=
"<div class='result'>Inserisci due ingredienti.</div>";

return;
}

const A=ingredients[a];
const B=ingredients[b];

if(!A||!B){

risultato.innerHTML=
"<div class='result'>Uno degli ingredienti non è presente nel database.</div>";

return;
}

const comuni=[];

for(const ingrediente in A.pairing){

if(B.pairing[ingrediente]){

const score=
A.pairing[ingrediente]+
B.pairing[ingrediente];

comuni.push({
nome:ingrediente,
score:score
});

}

}

comuni.sort((a,b)=>b.score-a.score);

let html=`
<div class="result">

<h3>${A.nome} + ${B.nome}</h3>

<p>
<strong>Terzi ingredienti suggeriti:</strong>
</p>
`;

if(comuni.length===0){

html+="Nessun terzo ingrediente comune trovato.";

}else{

comuni.slice(0,8).forEach(item=>{

html+=`
<span class="tag">
${item.nome} ⭐ ${item.score}
</span>
`;

});

}

html+="</div>";

risultato.innerHTML=html;

}


/* =========================
   TRIANGOLO
========================= */

function triangolo(){

const a=normalizza(
document.getElementById("tri1").value
);

const b=normalizza(
document.getElementById("tri2").value
);

const c=normalizza(
document.getElementById("tri3").value
);

const risultato=document.getElementById("analisi");

if(!a||!b||!c){

risultato.innerHTML=
"<div class='result'>Inserisci tre ingredienti.</div>";

return;
}

const A=ingredients[a];
const B=ingredients[b];
const C=ingredients[c];

if(!A||!B||!C){

risultato.innerHTML=
"<div class='result'>Uno o più ingredienti non sono presenti nel database.</div>";

return;
}

let score=0;

score+=A.pairing[b]||0;
score+=A.pairing[c]||0;

score+=B.pairing[a]||0;
score+=B.pairing[c]||0;

score+=C.pairing[a]||0;
score+=C.pairing[b]||0;

const massimo=30;

const percentuale=
Math.round((score/massimo)*100);

let giudizio;

if(percentuale>=75){

giudizio="Compatibilità elevata";

}else if(percentuale>=50){

giudizio="Compatibilità interessante";

}else if(percentuale>=30){

giudizio="Compatibilità moderata";

}else{

giudizio="Compatibilità debole";

}

risultato.innerHTML=`

<div class="result">

<h3>
${A.nome} + ${B.nome} + ${C.nome}
</h3>

<div class="score">
${percentuale}%
</div>

<p>
<strong>${giudizio}</strong>
</p>

<p>
Il punteggio deriva dalle relazioni presenti nel database.
</p>

</div>

`;

}

</script>

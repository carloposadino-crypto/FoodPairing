<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FoodPairing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      opacity: 0.8;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px 40px;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #111;
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #eee;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .status.ok {
      background: #e4f6e8;
      color: #176b2c;
    }

    .status.error {
      background: #fde5e5;
      color: #a00000;
    }

    .status.loading {
      background: #fff4d6;
      color: #765500;
    }

    .suggestions {
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }

    .suggestion {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .suggestion:last-child {
      border-bottom: none;
    }

    .suggestion:hover {
      background: #f2f2f2;
    }

    .result {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .result h3 {
      margin: 0 0 8px;
    }

    .score {
      font-weight: bold;
      font-size: 18px;
    }

    .type {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 6px;
      background: #e9e9e9;
      font-size: 12px;
      margin-top: 5px;
    }

    .profile {
      margin-top: 6px;
      font-size: 14px;
      color: #555;
    }

    .empty {
      color: #777;
      padding: 10px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      margin-top: 0;
    }

    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>FoodPairing</h1>
  <p>Ingredienti · profili · abbinamenti</p>
</header>

<main>

  <div id="databaseStatus" class="status loading">
    Caricamento database...
  </div>

  <!-- RICERCA -->
  <div class="box">

    <h2 class="section-title">Ricerca ingrediente</h2>

    <label for="ingrediente">
      Ingrediente
    </label>

    <input
      type="text"
      id="ingrediente"
      placeholder="Scrivi un ingrediente..."
      autocomplete="off"
    >

    <div id="suggerimenti" class="suggestions"></div>

    <div class="grid" style="margin-top:15px;">

      <div>
        <label for="tipoFiltro">
          Tipo di abbinamento
        </label>

        <select id="tipoFiltro">
          <option value="tutti">
            Tutti
          </option>

          <option value="affinita">
            Affinità
          </option>

          <option value="contrasto">
            Contrasto
          </option>

          <option value="ponte_aromatico">
            Ponte aromatico
          </option>

          <option value="complementarita">
            Complementarità
          </option>
        </select>
      </div>

      <div>
        <label for="intensitaFiltro">
          Intensità minima
        </label>

        <select id="intensitaFiltro">
          <option value="0">Tutte</option>
          <option value="2">≥ 2</option>
          <option value="3">≥ 3</option>
          <option value="4">≥ 4</option>
          <option value="4.5">≥ 4.5</option>
        </select>
      </div>

    </div>

    <button onclick="cercaAbbinamenti()">
      Cerca abbinamenti
    </button>

    <div id="risultati"></div>

  </div>


  <!-- TERZO INGREDIENTE -->

  <div class="box">

    <h2 class="section-title">
      Trova il terzo ingrediente
    </h2>

    <p>
      Cerca un ingrediente che possa collegare i due ingredienti scelti.
    </p>

    <div class="grid">

      <div>
        <label for="ingredienteA">
          Ingrediente A
        </label>

        <input
          type="text"
          id="ingredienteA"
          placeholder="Es. mela"
        >
      </div>

      <div>
        <label for="ingredienteB">
          Ingrediente B
        </label>

        <input
          type="text"
          id="ingredienteB"
          placeholder="Es. maiale"
        >
      </div>

    </div>

    <label for="tipoTerzo" style="margin-top:15px;">
      Tipo di collegamento
    </label>

    <select id="tipoTerzo">

      <option value="tutti">
        Tutti
      </option>

      <option value="affinita">
        Affinità
      </option>

      <option value="contrasto">
        Contrasto
      </option>

      <option value="ponte_aromatico">
        Ponte aromatico
      </option>

      <option value="complementarita">
        Complementarità
      </option>

    </select>

    <button onclick="trovaTerzoIngrediente()">
      Trova terzo ingrediente
    </button>

    <div id="risultatiTerzo"></div>

  </div>


  <!-- TRIANGOLO -->

  <div class="box">

    <h2 class="section-title">
      Analisi del triangolo
    </h2>

    <p>
      Analizza la relazione tra tre ingredienti.
    </p>

    <div class="grid">

      <div>
        <label for="triA">
          Ingrediente 1
        </label>

        <input
          type="text"
          id="triA"
          placeholder="Es. manzo"
        >
      </div>

      <div>
        <label for="triB">
          Ingrediente 2
        </label>

        <input
          type="text"
          id="triB"
          placeholder="Es. funghi"
        >
      </div>

      <div>
        <label for="triC">
          Ingrediente 3
        </label>

        <input
          type="text"
          id="triC"
          placeholder="Es. parmigiano"
        >
      </div>

    </div>

    <button onclick="analizzaTriangolo()">
      Analizza triangolo
    </button>

    <div id="risultatiTriangolo"></div>

  </div>

</main>


<script>

  /* =========================================================
     DATABASE
  ========================================================= */

  let database = {};
  let pairingTypes = {};


  /* =========================================================
     CARICAMENTO DATABASE
  ========================================================= */

  async function loadDatabase() {

    const status = document.getElementById("databaseStatus");

    status.className = "status loading";
    status.textContent = "Caricamento database...";

    try {

      /*
       * Usiamo il percorso relativo.
       * Questo funziona anche se il repository GitHub
       * viene pubblicato dentro una sottocartella.
       */

      const url = new URL(
        "database.json",
        window.location.href
      );

      const response = await fetch(
        url.href + "?v=" + Date.now()
      );

      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status +
          " - impossibile leggere database.json"
        );

      }

      const data = await response.json();

      if (!data || typeof data !== "object") {

        throw new Error(
          "database.json non contiene un oggetto JSON valido"
        );

      }

      /*
       * Recuperiamo i tipi di pairing se presenti.
       */

      if (data._pairing_types) {

        pairingTypes = data._pairing_types;

        delete data._pairing_types;

      }

      database = data;

      const numeroIngredienti =
        Object.keys(database).length;

      if (numeroIngredienti === 0) {

        throw new Error(
          "Il database è stato caricato ma non contiene ingredienti"
        );

      }

      status.className = "status ok";

      status.textContent =
        "✓ Database caricato correttamente — " +
        numeroIngredienti +
        " ingredienti";


      /*
       * Dopo il caricamento abilitiamo le funzioni.
       */

      inizializzaAutocomplete();

    }

    catch (errore) {

      console.error(
        "Errore caricamento database:",
        errore
      );

      status.className = "status error";

      status.innerHTML =
        "❌ <strong>Errore nel caricamento del database</strong><br>" +
        errore.message +
        "<br><br>" +
        "Controlla che <strong>database.json</strong> sia nella stessa cartella di index.html.";

    }

  }


  /* =========================================================
     NORMALIZZAZIONE
  ========================================================= */

  function normalizza(testo) {

    return String(testo || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();

  }


  /* =========================================================
     TROVA CHIAVE INGREDIENTE
  ========================================================= */

  function trovaChiave(nome) {

    const ricerca = normalizza(nome);

    if (!ricerca) {
      return null;
    }

    /*
     * Prima cerchiamo la chiave esatta.
     */

    for (const chiave of Object.keys(database)) {

      if (
        normalizza(chiave) === ricerca
      ) {

        return chiave;

      }

    }


    /*
     * Poi cerchiamo tramite il campo nome.
     */

    for (const chiave of Object.keys(database)) {

      const ingrediente = database[chiave];

      if (
        ingrediente &&
        ingrediente.nome &&
        normalizza(ingrediente.nome) === ricerca
      ) {

        return chiave;

      }

    }


    /*
     * Infine cerchiamo una corrispondenza parziale.
     */

    for (const chiave of Object.keys(database)) {

      const ingrediente = database[chiave];

      const nomeIngrediente =
        ingrediente && ingrediente.nome
          ? normalizza(ingrediente.nome)
          : "";

      if (
        normalizza(chiave).includes(ricerca) ||
        nomeIngrediente.includes(ricerca)
      ) {

        return chiave;

      }

    }

    return null;

  }


  /* =========================================================
     AUTOCOMPLETE
  ========================================================= */

  function inizializzaAutocomplete() {

    const campi = [
      "ingrediente",
      "ingredienteA",
      "ingredienteB",
      "triA",
      "triB",
      "triC"
    ];

    campi.forEach(id => {

      const campo =
        document.getElementById(id);

      if (!campo) {
        return;
      }

      campo.addEventListener(
        "input",
        function () {

          mostraSuggerimenti(
            campo
          );

        }
      );

    });

  }


  function mostraSuggerimenti(campo) {

    /*
     * L'autocomplete viene mostrato solo
     * per il campo principale.
     */

    if (campo.id !== "ingrediente") {

      return;

    }

    const contenitore =
      document.getElementById(
        "suggerimenti"
      );

    const testo =
      normalizza(campo.value);

    contenitore.innerHTML = "";

    if (!testo) {

      return;

    }

    const risultati =
      Object.keys(database)
        .filter(chiave => {

          const ingrediente =
            database[chiave];

          const nome =
            ingrediente && ingrediente.nome
              ? normalizza(ingrediente.nome)
              : "";

          return (
            normalizza(chiave).includes(testo) ||
            nome.includes(testo)
          );

        })
        .slice(0, 8);


    risultati.forEach(chiave => {

      const ingrediente =
        database[chiave];

      const div =
        document.createElement("div");

      div.className = "suggestion";

      div.textContent =
        ingrediente.nome || chiave;

      div.onclick = function () {

        campo.value =
          ingrediente.nome || chiave;

        contenitore.innerHTML = "";

      };

      contenitore.appendChild(div);

    });

  }


  /* =========================================================
     PROFILO
  ========================================================= */

  function profiloIngrediente(ingrediente) {

    if (!ingrediente) {

      return "";

    }

    if (
      Array.isArray(
        ingrediente.profilo
      )
    ) {

      return ingrediente.profilo.join(", ");

    }

    return "";

  }


  /* =========================================================
     TIPO ABBINAMENTO
  ========================================================= */

  function ottieniTipoAbbinamento(
    ingredienteA,
    ingredienteB
  ) {

    if (
      !ingredienteA ||
      !ingredienteB
    ) {

      return null;

    }

    const pairing =
      ingredienteA.pairing || {};

    const chiaveB =
      normalizza(ingredienteB);

    /*
     * Cerchiamo direttamente.
     */

    for (const chiave of Object.keys(pairing)) {

      if (
        normalizza(chiave) === chiaveB
      ) {

        const valore =
          pairing[chiave];

        if (
          valore &&
          typeof valore === "object" &&
          valore.tipo
        ) {

          return valore.tipo;

        }

      }

    }

    return null;

  }


  /* =========================================================
     PUNTEGGIO ABBINAMENTO
  ========================================================= */

  function punteggioAbbinamento(
    chiaveA,
    chiaveB
  ) {

    const a =
      database[chiaveA];

    const b =
      database[chiaveB];

    if (!a || !b) {

      return 0;

    }

    let punteggio = 0;

    /*
     * Pairing dichiarato da A.
     */

    if (a.pairing) {

      for (
        const chiave of Object.keys(a.pairing)
      ) {

        if (
          normalizza(chiave) ===
          normalizza(chiaveB)
        ) {

          const valore =
            a.pairing[chiave];

          if (
            typeof valore === "number"
          ) {

            punteggio =
              Math.max(
                punteggio,
                valore
              );

          }

          else if (
            valore &&
            typeof valore === "object"
          ) {

            if (
              typeof valore.intensita ===
              "number"
            ) {

              punteggio =
                Math.max(
                  punteggio,
                  valore.intensita
                );

            }

            else if (
              typeof valore.score ===
              "number"
            ) {

              punteggio =
                Math.max(
                  punteggio,
                  valore.score
                );

            }

          }

        }

      }

    }


    /*
     * Pairing dichiarato da B.
     */

    if (b.pairing) {

      for (
        const chiave of Object.keys(b.pairing)
      ) {

        if (
          normalizza(chiave) ===
          normalizza(chiaveA)
        ) {

          const valore =
            b.pairing[chiave];

          if (
            typeof valore === "number"
          ) {

            punteggio =
              Math.max(
                punteggio,
                valore
              );

          }

          else if (
            valore &&
            typeof valore === "object"
          ) {

            if (
              typeof valore.intensita ===
              "number"
            ) {

              punteggio =
                Math.max(
                  punteggio,
                  valore.intensita
                );

            }

            else if (
              typeof valore.score ===
              "number"
            ) {

              punteggio =
                Math.max(
                  punteggio,
                  valore.score
                );

            }

          }

        }

      }

    }

    return punteggio;

  }


  /* =========================================================
     CERCA ABBINAMENTI
  ========================================================= */

  function cercaAbbinamenti() {

    const input =
      document.getElementById(
        "ingrediente"
      );

    const risultatiBox =
      document.getElementById(
        "risultati"
      );

    const tipo =
      document.getElementById(
        "tipoFiltro"
      ).value;

    const intensita =
      parseFloat(
        document.getElementById(
          "intensitaFiltro"
        ).value
      );

    risultatiBox.innerHTML = "";

    const chiave =
      trovaChiave(input.value);

    if (!chiave) {

      risultatiBox.innerHTML =
        '<div class="empty">' +
        'Ingrediente non trovato nel database.' +
        '</div>';

      return;

    }

    const ingrediente =
      database[chiave];


    const risultati = [];


    /*
     * Scorriamo tutti gli ingredienti.
     */

    Object.keys(database).forEach(
      altraChiave => {

        if (
          altraChiave === chiave
        ) {

          return;

        }

        const altro =
          database[altraChiave];

        const score =
          punteggioAbbinamento(
            chiave,
            altraChiave
          );

        if (
          score < intensita
        ) {

          return;

        }

        let tipoRisultato =
          ottieniTipoAbbinamento(
            ingrediente,
            altro
          );


        /*
         * Se il tipo non è dichiarato,
         * proviamo a recuperarlo dall'altro ingrediente.
         */

        if (!tipoRisultato) {

          tipoRisultato =
            ottieniTipoAbbinamento(
              altro,
              ingrediente
            );

        }


        /*
         * Se l'utente ha scelto un tipo,
         * filtriamo.
         */

        if (
          tipo !== "tutti" &&
          tipoRisultato !== tipo
        ) {

          return;

        }


        /*
         * Se c'è un punteggio,
         * aggiungiamo il risultato.
         */

        if (score > 0) {

          risultati.push({

            chiave:
              altraChiave,

            ingrediente:
              altro,

            score:
              score,

            tipo:
              tipoRisultato

          });

        }

      }
    );


    /*
     * Ordine dal punteggio maggiore.
     */

    risultati.sort(
      (a, b) =>
        b.score - a.score
    );


    /*
     * Mostra massimo 30 risultati.
     */

    const limitati =
      risultati.slice(0, 30);


    if (
      limitati.length === 0
    ) {

      risultatiBox.innerHTML =
        '<div class="empty">' +
        'Nessun abbinamento trovato con i filtri selezionati.' +
        '</div>';

      return;

    }


    const titolo =
      document.createElement("h3");

    titolo.textContent =
      "Abbinamenti per " +
      (
        ingrediente.nome ||
        chiave
      );

    risultatiBox.appendChild(
      titolo
    );


    limitati.forEach(
      risultato => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "result";


        const nome =
          risultato.ingrediente.nome ||
          risultato.chiave;

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodPairing Test</title>
</head>

<body>

<h1>FoodPairing</h1>

<div id="databaseStatus">
  Caricamento database...
</div>

<script>

document.getElementById("databaseStatus").textContent =
  "JavaScript funzionante — provo a caricare il database...";

async function testDatabase() {

  try {

    const risposta = await fetch("./database.json?v=" + Date.now());

    if (!risposta.ok) {

      throw new Error(
        "Errore HTTP: " + risposta.status
      );

    }

    const dati = await risposta.json();

    const numero =
      Object.keys(dati).length;

    document.getElementById("databaseStatus").innerHTML =
      "✅ DATABASE CARICATO<br><br>" +
      "Elementi trovati: " + numero;

    console.log("DATABASE:", dati);

  }

  catch (errore) {

    document.getElementById("databaseStatus").innerHTML =
      "❌ ERRORE<br><br>" +
      errore.message;

    console.error(errore);

  }

}

testDatabase();

</script>

</body>
</html>

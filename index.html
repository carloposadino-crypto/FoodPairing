<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodPairing</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f2ed;
  color: #222;
}

header {
  background: #1f1f1f;
  color: white;
  padding: 24px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 8px 0 0;
  color: #ccc;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  transform: scale(.99);
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #f1eee8;
  border-radius: 10px;
}

.tag {
  display: inline-block;
  background: #ddd5c8;
  padding: 8px 10px;
  margin: 4px;
  border-radius: 20px;
}

.score {
  font-size: 28px;
  font-weight: bold;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #ddd;
}

.item:last-child {
  border-bottom: none;
}

.stars {
  white-space: nowrap;
}

.status {
  text-align: center;
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 10px;
  background: #e8e4dc;
  color: #555;
  font-size: 14px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>FoodPairing</h1>
  <p>Il motore intelligente per gli abbinamenti gastronomici</p>
</header>

<div class="container">

  <div id="databaseStatus" class="status">
    Caricamento database...
  </div>


  <div class="card">

    <h2>🔎 Cerca ingrediente</h2>

    <input
      id="search"
      type="text"
      placeholder="Es. mela, manzo, cioccolato..."
      autocomplete="off"
    >

    <button onclick="cerca()">
      Cerca abbinamenti
    </button>

    <div id="risultato"></div>

  </div>


  <div class="card">

    <h2>🍽️ Trova il terzo ingrediente</h2>

    <input
      id="ingrediente1"
      type="text"
      placeholder="Primo ingrediente"
      autocomplete="off"
    >

    <input
      id="ingrediente2"
      type="text"
      placeholder="Secondo ingrediente"
      autocomplete="off"
    >

    <button onclick="terzoIngrediente()">
      Trova il terzo ingrediente
    </button>

    <div id="terzo"></div>

  </div>


  <div class="card">

    <h2>🔺 Analizza tre ingredienti</h2>

    <input
      id="tri1"
      type="text"
      placeholder="Ingrediente 1"
      autocomplete="off"
    >

    <input
      id="tri2"
      type="text"
      placeholder="Ingrediente 2"
      autocomplete="off"
    >

    <input
      id="tri3"
      type="text"
      placeholder="Ingrediente 3"
      autocomplete="off"
    >

    <button onclick="triangolo()">
      Analizza combinazione
    </button>

    <div id="analisi"></div>

  </div>

</div>

<footer>
  FoodPairing — sviluppo in corso
</footer>


<script>

/* =====================================================
   DATABASE ESTERNO
===================================================== */

let ingredients = {};


/* =====================================================
   CARICAMENTO DATABASE.JSON
===================================================== */

async function loadDatabase() {

  const status =
    document.getElementById("databaseStatus");

  try {

    const response =
      await fetch("database.json");

    if (!response.ok) {
      throw new Error("Database non trovato");
    }

    ingredients =
      await response.json();

    status.innerHTML =
      "✓ Database caricato correttamente";

    console.log(
      "FoodPairing database:",
      ingredients
    );

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Errore nel caricamento del database";

    document.getElementById("risultato").innerHTML = `
      <div class="result">
        <strong>Database non disponibile.</strong>
        <p>
          Controlla che il file
          <strong>database.json</strong>
          sia presente nel repository.
        </p>
      </div>
    `;

  }

}


/* =====================================================
   NORMALIZZAZIONE
===================================================== */

function normalizza(testo) {

  return testo
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");

}


/* =====================================================
   CERCA INGREDIENTE
===================================================== */

function cerca() {

  const input =
    normalizza(
      document.getElementById("search").value
    );

  const risultato =
    document.getElementById("risultato");

  if (!input) {

    risultato.innerHTML =
      "<div class='result'>Inserisci un ingrediente.</div>";

    return;
  }

  const ingrediente =
    ingredients[input];

  if (!ingrediente) {

    risultato.innerHTML = `
      <div class="result">

        <strong>Ingrediente non trovato.</strong>

        <p>
          Questo ingrediente non è ancora
          presente nel database.
        </p>

      </div>
    `;

    return;
  }

  const ordinati =
    Object.entries(ingrediente.pairing || {})
      .sort((a,b) => b[1] - a[1]);


  let html = `

    <div class="result">

      <h3>${ingrediente.nome}</h3>

      <p>
        <strong>Categoria:</strong>
        ${ingrediente.categoria}
      </p>

      <p>
        <strong>Famiglia:</strong>
        ${ingrediente.famiglia}
      </p>

      <p>
        <strong>Profilo:</strong>
        ${ingrediente.profilo.join(", ")}
      </p>

      <hr>

      <h4>Abbinamenti</h4>

  `;


  if (ordinati.length === 0) {

    html +=
      "<p>Nessun pairing registrato.</p>";

  } else {

    ordinati.forEach(
      ([nome, punteggio]) => {

        html += `

          <div class="item">

            <span>
              ${nome}
            </span>

            <span class="stars">
              ${"★".repeat(punteggio)}
            </span>

          </div>

        `;

      }
    );

  }


  html += "</div>";

  risultato.innerHTML = html;

}


/* =====================================================
   TROVA IL TERZO INGREDIENTE
===================================================== */

function terzoIngrediente() {

  const a =
    normalizza(
      document.getElementById("ingrediente1").value
    );

  const b =
    normalizza(
      document.getElementById("ingrediente2").value
    );

  const risultato =
    document.getElementById("terzo");


  if (!a || !b) {

    risultato.innerHTML =
      "<div class='result'>Inserisci due ingredienti.</div>";

    return;
  }


  const A =
    ingredients[a];

  const B =
    ingredients[b];


  if (!A || !B) {

    risultato.innerHTML = `
      <div class="result">

        Uno degli ingredienti non è
        presente nel database.

      </div>
    `;

    return;
  }


  const comuni = [];


  for (
    const ingrediente in (A.pairing || {})
  ) {

    if (
      B.pairing &&
      B.pairing[ingrediente]
    ) {

      const score =
        A.pairing[ingrediente] +
        B.pairing[ingrediente];


      comuni.push({
        nome: ingrediente,
        score: score
      });

    }

  }


  comuni.sort(
    (a,b) => b.score - a.score
  );


  let html = `

    <div class="result">

      <h3>
        ${A.nome} + ${B.nome}
      </h3>

      <p>
        <strong>
          Terzi ingredienti suggeriti:
        </strong>
      </p>

  `;


  if (comuni.length === 0) {

    html +=
      "Nessun terzo ingrediente comune trovato.";

  } else {

    comuni
      .slice(0,8)
      .forEach(item => {

        html += `

          <div class="item">

            <span>
              ${item.nome}
            </span>

            <span>
              ${item.score}
            </span>

          </div>

        `;

      });

  }


  html += "</div>";

  risultato.innerHTML = html;

}


/* =====================================================
   ANALISI TRIANGOLO
===================================================== */

function triangolo() {

  const a =
    normalizza(
      document.getElementById("tri1").value
    );

  const b =
    normalizza(
      document.getElementById("tri2").value
    );

  const c =
    normalizza(
      document.getElementById("tri3").value
    );


  const risultato =
    document.getElementById("analisi");


  if (!a || !b || !c) {

    risultato.innerHTML =
      "<div class='result'>Inserisci tre ingredienti.</div>";

    return;
  }


  const A =
    ingredients[a];

  const B =
    ingredients[b];

  const C =
    ingredients[c];


  if (!A || !B || !C) {

    risultato.innerHTML = `
      <div class="result">

        Uno o più ingredienti non sono
        presenti nel database.

      </div>
    `;

    return;
  }


  let score = 0;


  score +=
    A.pairing?.[b] || 0;

  score +=
    A.pairing?.[c] || 0;

  score +=
    B.pairing?.[a] || 0;

  score +=
    B.pairing?.[c] || 0;

  score +=
    C.pairing?.[a] || 0;

  score +=
    C.pairing?.[b] || 0;


  const percentuale =
    Math.round(
      (score / 30) * 100
    );


  let giudizio;


  if (percentuale >= 75) {

    giudizio =
      "Compatibilità elevata";

  } else if (percentuale >= 50) {

    giudizio =
      "Compatibilità interessante";

  } else if (percentuale >= 30) {

    giudizio =
      "Compatibilità moderata";

  } else {

    giudizio =
      "Compatibilità debole";

  }


  risultato.innerHTML = `

    <div class="result">

      <h3>
        ${A.nome} +
        ${B.nome} +
        ${C.nome}
      </h3>

      <div class="score">
        ${percentuale}%
      </div>

      <p>
        <strong>
          ${giudizio}
        </strong>
      </p>

      <p>
        Il punteggio è calcolato
        utilizzando le relazioni
        presenti nel database.
      </p>

    </div>

  `;

}


/* =====================================================
   AVVIO APP
===================================================== */

loadDatabase();

</script>

</body>
</html>

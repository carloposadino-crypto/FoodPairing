<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodPairing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}header{background:#111;color:#fff;text-align:center;padding:20px}header h1{margin:0 0 5px}header p{margin:0;opacity:.8}main{max-width:900px;margin:20px auto;padding:0 15px}.box{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px #0001}label{display:block;font-weight:bold;margin:12px 0 6px}input,select,button{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{background:#111;color:#fff;border:0;font-weight:bold;margin-top:15px;cursor:pointer}.field,.triple-field{position:relative}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.suggest{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid #ccc;max-height:220px;overflow:auto;display:none}.suggest div{padding:11px;border-bottom:1px solid #eee;cursor:pointer}.suggest div:hover{background:#f1f1f1}.result{margin-top:10px;padding:15px;border:1px solid #ddd;border-radius:10px;cursor:pointer;touch-action:manipulation}.result:hover{box-shadow:0 4px 12px #0002}.score{font-size:18px;font-weight:bold;margin-top:8px}.muted{font-size:13px;color:#666;margin-top:8px}.empty{padding:15px;background:#f5f5f5;border-radius:8px;margin-top:15px;color:#666}.label{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:6px;background:#eee;font-size:12px;font-weight:bold}.status{text-align:center;color:#666;font-size:14px;margin-bottom:15px}.plate{margin-top:12px;padding:12px;border-radius:8px;background:#f7f7f7;border:1px solid #ddd}.plate h4{margin:0 0 8px}.plate button{margin-top:10px}.plate-panel{display:none;margin-top:10px}.plate-panel.open{display:block}.builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.builder-grid label{font-size:13px;margin:4px 0}.builder-result{margin-top:10px}.builder-result .plate{background:#fff}@media(max-width:650px){.grid{grid-template-columns:1fr}.box{padding:15px}.builder-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>FoodPairing</h1><p>Ingredienti e abbinamenti</p></header>
<main>
<div id="status" class="status">Caricamento database...</div>
<section class="box">
<h2>Cerca un ingrediente</h2>
<div class="field"><label>Ingrediente</label><input id="ingrediente" placeholder="Es. mela" autocomplete="off"><div id="suggestMain" class="suggest"></div></div>
<label>Categoria</label><select id="categoria"><option value="">Tutte</option></select>
<label>Intensità minima</label><select id="intensita"><option value="0">Tutte</option><option value="2">≥ 2</option><option value="3">≥ 3</option><option value="4">≥ 4</option><option value="4.5">≥ 4.5</option></select>
<button id="cerca">Cerca abbinamenti</button><div id="risultati"></div>
</section>
<section class="box">
<h2>Esplora 3 ingredienti</h2>
<p class="muted">Inserisci tre ingredienti. L'app cerca un quarto ingrediente e valuta tutti i 6 legami della combinazione completa.</p>
<div class="grid"><div class="triple-field"><label>Ingrediente 1</label><input id="i1" placeholder="Es. mela" autocomplete="off"><div id="s1" class="suggest"></div></div><div class="triple-field"><label>Ingrediente 2</label><input id="i2" placeholder="Es. maiale" autocomplete="off"><div id="s2" class="suggest"></div></div></div>
<div class="triple-field"><label>Ingrediente 3</label><input id="i3" placeholder="Es. timo" autocomplete="off"><div id="s3" class="suggest"></div></div>
<button id="esplora">Esplora combinazioni</button><div id="risultati3"></div>
</section>
</main>
<script>
let db={};
const $=id=>document.getElementById(id);
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const nome=k=>db[k]?.nome||k;
function find(s){s=norm(s);if(!s)return null;for(const k of Object.keys(db)){if(s===norm(k)||s===norm(nome(k)))return{key:k,data:db[k]}}return null}
function scoreData(a,b){if(!a?.pairing)return 0;const v=a.pairing[b];return typeof v==="number"?v:v&&typeof v.score==="number"?v.score:0}
function score(a,b){return Math.max(scoreData(db[a],b),scoreData(db[b],a))}
function evaluateCombination(keys){
  if(!Array.isArray(keys)||keys.length!==4||new Set(keys).size!==4)return null;
  const pairs=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
  const scores=pairs.map(p=>score(keys[p[0]],keys[p[1]]));
  if(scores.some(s=>s<=0))return null;
  const min=Math.min(...scores),avg=scores.reduce((a,b)=>a+b,0)/6;
  let profile=0;
  const profiles=keys.map(k=>Array.isArray(db[k]?.profilo)?db[k].profilo.map(norm):[]);
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)for(const p of profiles[i])if(profiles[j].includes(p))profile++;
  return {keys:[...keys],scores,min,avg,total:scores.reduce((a,b)=>a+b,0),profile};
}
function compareCombinations(a,b){return b.min-a.min||b.avg-a.avg||b.profile-a.profile||b.total-a.total}
function label(min,avg){if(min>=4&&avg>=4.5)return"Abbinamento molto forte";if(min>=4&&avg>=4)return"Abbinamento forte";if(min>=3&&avg>=3.5)return"Buon abbinamento";return"Da valutare"}
async function load(){try{const r=await fetch("./database.json?v="+Date.now());if(!r.ok)throw Error();db=await r.json();delete db._pairing_types;const cats=[...new Set(Object.values(db).map(x=>x?.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"it"));for(const c of cats){const o=document.createElement("option");o.value=c;o.textContent=c;$("categoria").appendChild(o)}$("status").textContent="Database caricato: "+Object.keys(db).length+" ingredienti"}catch(e){console.error(e);$("status").textContent="Errore nel caricamento del database."}}
function autocomplete(inputId,boxId){const inp=$(inputId),box=$(boxId);inp.addEventListener("input",()=>{const q=norm(inp.value);box.innerHTML="";if(!q){box.style.display="none";return}const arr=Object.keys(db).map(k=>({k,n:nome(k),d:db[k]})).filter(x=>norm(x.n).includes(q)||norm(x.k).includes(q)).sort((a,b)=>a.n.localeCompare(b.n,"it")).slice(0,15);for(const x of arr){const d=document.createElement("div");d.innerHTML="<b>"+esc(x.n)+"</b><br><small>"+esc(Array.isArray(x.d?.profilo)?x.d.profilo.join(", "):"")+"</small>";d.onclick=e=>{e.stopPropagation();inp.value=x.n;box.style.display="none"};box.appendChild(d)}box.style.display=box.children.length?"block":"none"})}
function search(){const f=find($("ingrediente").value),box=$("risultati");box.innerHTML="";if(!f){box.innerHTML='<div class="empty">Seleziona un ingrediente presente nel database.</div>';return}const cat=$("categoria").value,min=+$("intensita").value,arr=[];for(const k of Object.keys(db)){if(k===f.key)continue;if(cat&&db[k]?.categoria!==cat)continue;const s=score(f.key,k);if(s>0&&s>=min)arr.push({k,s})}arr.sort((a,b)=>b.s-a.s);box.innerHTML='<h3>Abbinamenti con '+esc(nome(f.key))+' ('+arr.length+')</h3>';if(!arr.length){box.innerHTML+='<div class="empty">Nessun abbinamento trovato con i filtri selezionati.</div>';return}for(const x of arr.slice(0,30)){const d=document.createElement("div");d.className="result";d.innerHTML="<h3>"+esc(nome(x.k))+"</h3><div>Categoria: <b>"+esc(db[x.k]?.categoria||"—")+"</b></div><div>Profilo: <b>"+esc(Array.isArray(db[x.k]?.profilo)?db[x.k].profilo.join(", "):"—")+"</b></div><div class='score'>Punteggio: "+x.s+"/5</div><div class='muted'>Tocca per usare questo ingrediente nella ricerca</div>";d.onclick=()=>{$("ingrediente").value=nome(x.k);search()};box.appendChild(d)}}
function explore(){const box=$("risultati3"),fs=[1,2,3].map(n=>find($("i"+n).value));box.innerHTML="";if(fs.some(x=>!x)){box.innerHTML='<div class="empty">Seleziona tre ingredienti presenti nel database.</div>';return}const keys=fs.map(x=>x.key);if(new Set(keys).size<3){box.innerHTML='<div class="empty">I tre ingredienti devono essere diversi.</div>';return}const base=fs.map(x=>({key:x.key,data:x.data})),out=[];for(const ck of Object.keys(db)){if(keys.includes(ck))continue;const ev=evaluateCombination([...keys,ck]);if(!ev)continue;out.push({ck,scores:ev.scores,min:ev.min,avg:ev.avg,total:ev.total,profile:ev.profile})}out.sort(compareCombinations);const bn=base.map(x=>nome(x.key));box.innerHTML='<h3>Combinazioni a 4 ingredienti ('+out.length+')</h3><div class="empty">Base: <b>'+esc(bn.join(" + "))+'</b><br>Valutazione su tutti i 6 legami.</div>';if(!out.length){box.innerHTML+='<div class="empty">Nessuna combinazione completa trovata nel database.</div>';return}for(const x of out.slice(0,20)){const cn=nome(x.ck),labs=[bn[0]+" ↔ "+bn[1],bn[0]+" ↔ "+bn[2],bn[1]+" ↔ "+bn[2],bn[0]+" ↔ "+cn,bn[1]+" ↔ "+cn,bn[2]+" ↔ "+cn],d=document.createElement("div");d.className="result";d.innerHTML="<h3>"+esc(cn)+"</h3>"+x.scores.map((s,i)=>"<div>"+esc(labs[i])+": <b>"+s+"/5</b></div>").join("")+"<div class='score'>Coerenza minima: "+x.min.toFixed(1)+"/5</div><div>Media dei 6 legami: <b>"+x.avg.toFixed(2)+"/5</b></div><div class='label'>"+esc(label(x.min,x.avg))+"</div><div class='plate'><button type='button' class='build'>Costruisci il piatto</button><div class='plate-panel'><h4>"+esc(bn.join(" + ")+" + "+cn)+"</h4><div>Legame più forte: <b>"+esc(labs[x.scores.indexOf(Math.max(...x.scores))])+" = "+Math.max(...x.scores)+"/5</b></div><div>Legame più debole: <b>"+esc(labs[x.scores.indexOf(Math.min(...x.scores))])+" = "+Math.min(...x.scores)+"/5</b></div><div>Coerenza complessiva: <b>"+x.avg.toFixed(2)+"/5</b></div><div>Profilo condiviso con la base: <b>"+x.profile+"</b></div></div></div><div class='muted'>Tocca il nome per usare questo ingrediente nella ricerca principale</div>";d.querySelector(".build").onclick=e=>{e.stopPropagation();const p=d.querySelector(".plate-panel");if(p.classList.contains("open")){p.classList.remove("open");return}p.classList.add("open");let builder=p.querySelector(".builder");if(!builder){builder=document.createElement("div");builder.className="builder";builder.innerHTML="<h4>Editor del piatto</h4><p class='muted'>Modifica liberamente tutti e 4 gli ingredienti e ricalcola la combinazione.</p><div class='builder-grid'></div><button type='button' class='recalc-builder'>Ricalcola combinazione</button><button type='button' class='find-best'>Trova il migliore</button><button type='button' class='auto-build'>Completa automaticamente</button><div class='builder-result'></div>";p.appendChild(builder);const bg=builder.querySelector(".builder-grid");const initial=[base[0].key,base[1].key,base[2].key,x.ck];for(let pos=0;pos<4;pos++){const wrap=document.createElement("div");const lab=document.createElement("label");lab.textContent="Ingrediente "+(pos+1);const sel=document.createElement("select");sel.dataset.pos=pos;for(const k of Object.keys(db)){const op=document.createElement("option");op.value=k;op.textContent=nome(k);if(k===initial[pos])op.selected=true;sel.appendChild(op)}wrap.appendChild(lab);wrap.appendChild(sel);bg.appendChild(wrap)}const findBest=()=>{const outb=builder.querySelector(".builder-result");const sels=[...builder.querySelectorAll("select")];const current=sels.map(s=>s.value);if(current.some(k=>!k)||new Set(current).size<4){outb.innerHTML="<div class='empty'>Per cercare la migliore sostituzione servono 4 ingredienti diversi.</div>";return}const base=evaluateCombination(current);if(!base){outb.innerHTML="<div class='empty'>La combinazione attuale non è completamente valutabile.</div>";return}const candidates=[];for(let pos=0;pos<4;pos++){for(const ak of Object.keys(db)){if(current.includes(ak))continue;const keys=[...current];keys[pos]=ak;const ev=evaluateCombination(keys);if(!ev)continue;if(ev.min>base.min||(ev.min===base.min&&ev.avg>base.avg))candidates.push({pos,ak,ev})}}candidates.sort((a,b)=>b.ev.min-a.ev.min||b.ev.avg-a.ev.avg||b.ev.profile-a.ev.profile||b.ev.total-a.ev.total);if(!candidates.length){outb.innerHTML="<div class='empty'>Nessuna sostituzione migliora la combinazione attuale.</div>";return}outb.innerHTML="<h4>Migliori sostituzioni</h4>"+candidates.slice(0,5).map((a,i)=>"<div class='plate'><b>"+(i+1)+". "+esc(nome(current[a.pos]))+" → "+esc(nome(a.ak))+"</b><div>Coerenza minima: <b>"+a.ev.min.toFixed(1)+"/5</b> ("+(a.ev.min-base.min>=0?"+":"")+ (a.ev.min-base.min).toFixed(1)+")</div><div>Media: <b>"+a.ev.avg.toFixed(2)+"/5</b> ("+(a.ev.avg-base.avg>=0?"+":"")+(a.ev.avg-base.avg).toFixed(2)+")</div><div class='label'>"+esc(label(a.ev.min,a.ev.avg))+"</div><button type='button' class='use-best' data-pos='"+a.pos+"' data-key='"+esc(a.ak)+"'>Applica sostituzione</button></div>").join("");outb.querySelectorAll(".use-best").forEach(b=>b.onclick=e=>{e.stopPropagation();sels[Number(b.dataset.pos)].value=b.dataset.key;renderBuilder()})};const autoBuild=(fixed)=>{const keys=[...fixed];const seen=new Set(keys);while(keys.length<4){let best=null;for(const ak of Object.keys(db)){if(seen.has(ak))continue;const test=[...keys,ak];const pairs=[];for(let i=0;i<test.length;i++)for(let j=i+1;j<test.length;j++){const v=score(test[i],test[j]);if(v<=0){pairs.length=0;break}pairs.push(v)}if(!pairs.length)continue;const ev={ak,min:Math.min(...pairs),avg:pairs.reduce((a,b)=>a+b,0)/pairs.length,total:pairs.reduce((a,b)=>a+b,0)};if(!best||ev.min>best.min||(ev.min===best.min&&ev.avg>best.avg)||(ev.min===best.min&&ev.avg===best.avg&&ev.total>best.total))best=ev}if(!best)break;keys.push(best.ak);seen.add(best.ak)}return keys.length===4?evaluateCombination(keys):null};const renderBuilder=()=>{const sels=[...builder.querySelectorAll("select")];const keys4=sels.map(s=>s.value);const outb=builder.querySelector(".builder-result");if(new Set(keys4).size<4){outb.innerHTML="<div class='empty'>I quattro ingredienti devono essere diversi.</div>";return}const be=evaluateCombination(keys4);if(!be){outb.innerHTML="<div class='empty'>Combinazione non valutabile: manca almeno uno dei 6 legami nel database.</div>";return}const labs4=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]].map(q=>nome(keys4[q[0]])+" ↔ "+nome(keys4[q[1]]));const strong=Math.max(...be.scores),weak=Math.min(...be.scores);outb.innerHTML="<div class='score'>Coerenza minima: "+be.min.toFixed(1)+"/5</div><div>Media dei 6 legami: <b>"+be.avg.toFixed(2)+"/5</b></div><div class='label'>"+esc(label(be.min,be.avg))+"</div><div class='plate'><b>6 legami</b>"+be.scores.map((s,i)=>"<div>"+esc(labs4[i])+": <b>"+s+"/5</b></div>").join("")+"</div><div class='muted'>Più forte: "+esc(labs4[be.scores.indexOf(strong)])+" · Più debole: "+esc(labs4[be.scores.indexOf(weak)])+" · Profili condivisi: "+be.profile+"</div>"};builder.querySelector(".recalc-builder").onclick=e=>{e.stopPropagation();renderBuilder()};builder.querySelector(".find-best").onclick=e=>{e.stopPropagation();findBest()};builder.querySelector(".auto-build").onclick=e=>{e.stopPropagation();const sels=[...builder.querySelectorAll("select")];const fixed=sels.map(s=>s.value).filter(Boolean);if(!fixed.length){builder.querySelector(".builder-result").innerHTML="<div class='empty'>Seleziona almeno un ingrediente.</div>";return}if(new Set(fixed).size!==fixed.length){builder.querySelector(".builder-result").innerHTML="<div class='empty'>Gli ingredienti devono essere diversi.</div>";return}const ev=autoBuild(fixed);if(!ev){builder.querySelector(".builder-result").innerHTML="<div class='empty'>Non riesco a completare questa combinazione con i dati disponibili.</div>";return}ev.keys.forEach((k,i)=>sels[i].value=k);renderBuilder()};renderBuilder()}
let improve=p.querySelector(".improve");if(improve)return;improve=document.createElement("div");improve.className="improve";improve.innerHTML="<button type='button' class='improve-btn'>Migliora combinazione</button><div class='improve-list'></div>";p.appendChild(improve);improve.querySelector(".improve-btn").onclick=ev=>{ev.stopPropagation();const list=improve.querySelector(".improve-list");list.innerHTML="";const current=x;const alternatives=[];for(const ak of Object.keys(db)){if([base[0].key,base[1].key,base[2].key,current.ck].includes(ak))continue;const ev=evaluateCombination([base[0].key,base[1].key,base[2].key,ak]);if(!ev)continue;alternatives.push({ak,ss:ev.scores,mn:ev.min,av:ev.avg,pr:ev.profile,total:ev.total})}alternatives.sort((a,b)=>b.mn-a.mn||b.av-a.av||b.pr-a.pr||b.total-a.total);if(!alternatives.length){list.innerHTML="<div class='empty'>Nessuna sostituzione migliora la combinazione con i dati disponibili.</div>";return}const shown=alternatives.slice(0,5);list.innerHTML="<h4>Migliorie trovate</h4>"+shown.map((a,idx)=>{const oldWeak=Math.min(...current.scores),newWeak=Math.min(...a.ss),delta=newWeak-oldWeak;const newAvg=a.av-current.avg;return "<div class='plate'><b>"+(idx+1)+". "+esc(nome(a.ak))+"</b><div>Coerenza minima: <b>"+newWeak.toFixed(1)+"/5</b> ("+(delta>=0?"+":"")+delta.toFixed(1)+")</div><div>Media: <b>"+a.av.toFixed(2)+"/5</b> ("+(newAvg>=0?"+":"")+newAvg.toFixed(2)+")</div><div class='muted'>Sostituisce: "+esc(cn)+"</div><button type='button' class='replace'>Sostituisci</button></div>"}) ;improve.querySelectorAll(".replace").forEach((b,i)=>b.onclick=ev=>{ev.stopPropagation();const ak=shown[i].ak;$("i1").value=nome(base[0].key);$("i2").value=nome(base[1].key);$("i3").value=nome(ak);$("risultati3").scrollIntoView({behavior:"smooth"});explore()});
const opt=document.createElement("div");opt.className="plate";opt.innerHTML="<button type='button' class='optimize-btn'>Ottimizza tutta la combinazione</button><div class='optimize-list'></div>";p.appendChild(opt);
opt.querySelector(".optimize-btn").onclick=ev=>{ev.stopPropagation();const list=opt.querySelector(".optimize-list");list.innerHTML="";const currentKeys=[base[0].key,base[1].key,base[2].key,current.ck];const currentEval={scores:current.scores,min:current.min,avg:current.avg};const candidates=[];
for(let pos=0;pos<4;pos++){for(const ak of Object.keys(db)){if(currentKeys.includes(ak))continue;const keys=[...currentKeys];keys[pos]=ak;const ev=evaluateCombination(keys);if(!ev)continue;candidates.push({pos,ak,ss:ev.scores,mn:ev.min,av:ev.avg,pr:ev.profile,total:ev.total})}}
candidates.sort((a,b)=>b.mn-a.mn||b.av-a.av||b.pr-a.pr||b.total-a.total);
const real=candidates.filter(a=>a.mn>currentEval.min||(a.mn===currentEval.min&&a.av>currentEval.avg));
if(!real.length){list.innerHTML="<div class='empty'>Nessun miglioramento reale trovato nei dati disponibili.</div>";return}
list.innerHTML="<h4>Migliori sostituzioni globali</h4>"+real.slice(0,5).map((a,i)=>{const old=currentKeys[a.pos],dw=a.mn-currentEval.min,da=a.av-currentEval.avg;return "<div class='plate'><b>"+(i+1)+". "+esc(nome(old))+" → "+esc(nome(a.ak))+"</b><div>Coerenza minima: <b>"+a.mn.toFixed(1)+"/5</b> ("+(dw>=0?"+":"")+dw.toFixed(1)+")</div><div>Media: <b>"+a.av.toFixed(2)+"/5</b> ("+(da>=0?"+":"")+da.toFixed(2)+")</div><div class='label'>"+esc(label(a.mn,a.av))+"</div><button type='button' class='apply-global'>Applica sostituzione</button></div>" }).join("");
list.querySelectorAll(".apply-global").forEach((b,i)=>b.onclick=ev=>{ev.stopPropagation();const a=real[i];const vals=[...currentKeys];vals[a.pos]=a.ak;for(let j=0;j<4;j++)$("i"+(j+1)).value=nome(vals[j]);$("risultati3").scrollIntoView({behavior:"smooth"});explore()})};};};d.onclick=()=>{$("ingrediente").value=cn;$("risultati").scrollIntoView({behavior:"smooth"});search()};box.appendChild(d)}}
document.addEventListener("DOMContentLoaded",()=>{autocomplete("ingrediente","suggestMain");autocomplete("i1","s1");autocomplete("i2","s2");autocomplete("i3","s3");$("cerca").onclick=search;$("ingrediente").onkeydown=e=>{if(e.key==="Enter")search()};$("esplora").onclick=explore;document.onclick=e=>{if(!e.target.closest(".field"))$("suggestMain").style.display="none";if(!e.target.closest(".triple-field"))document.querySelectorAll(".suggest").forEach(x=>x.style.display="none")};load()});
</script>
</body>
</html>
